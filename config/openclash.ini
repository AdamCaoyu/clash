;草鱼日常配置：台湾优先、账号固定、新加坡 Netflix。
;沿用现有订阅转换服务；可配合 OpenClash 的“使用规则集”。
;维护源：config/openclash.ini；运行 scripts/sync_templates.py 同步兼容入口。
;1. 有序规则：局域网 → 精确业务 → 中国 → 国外 → 漏网。
ruleset=DIRECT,[]DOMAIN-SUFFIX,lan
ruleset=DIRECT,[]DOMAIN-SUFFIX,local
ruleset=DIRECT,[]DOMAIN-SUFFIX,home.arpa
