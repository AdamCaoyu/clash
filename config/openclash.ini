;2. 业务策略；固定组不会按延迟自动换节点。
custom_proxy_group=🧭 日常代理`select`[]台湾-固定`[]香港-固定`[]日本-固定`[]新加坡-固定`[]美国-固定`[]全部-手动
custom_proxy_group=🔐 稳定账号`select`[]台湾-固定`[]美国-固定`[]日本-固定`[]新加坡-固定`[]全部-手动
custom_proxy_group=🍏 Apple Intelligence`select`[]🔐 稳定账号`[]台湾-固定`[]美国-固定`[]日本-固定`[]新加坡-固定`[]REJECT
custom_proxy_group=🤖 AI`select`[]🔐 稳定账号`[]台湾-固定`[]美国-固定`[]日本-固定`[]新加坡-固定`[]REJECT
custom_proxy_group=💼 工作账号`select`[]🔐 稳定账号`[]台湾-固定`[]美国-固定`[]日本-固定`[]新加坡-固定`[]DIRECT
custom_proxy_group=💳 海外账户`select`[]🔐 稳定账号`[]台湾-固定`[]美国-固定`[]日本-固定`[]新加坡-固定`[]DIRECT
custom_proxy_group=🎥 Netflix`select`[]新加坡-固定`[]台湾-固定`[]日本-固定`[]美国-固定`[]香港-固定`[]全部-手动
custom_proxy_group=🎬 国际媒体`select`[]🧭 日常代理`[]台湾-固定`[]新加坡-固定`[]日本-固定`[]美国-固定`[]香港-固定
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]台湾-固定`[]美国-固定`[]日本-固定`[]新加坡-固定
custom_proxy_group=🎮 游戏`select`[]🧭 日常代理`[]DIRECT`[]台湾-固定`[]香港-固定`[]日本-固定`[]美国-固定
custom_proxy_group=➡️ 国内`select`[]DIRECT`[]🧭 日常代理
custom_proxy_group=🌐 漏网`select`[]🧭 日常代理`[]DIRECT

;3. 地区固定组：首次默认列表中的首个合格节点，请选定常用节点。
;无匹配节点时 REJECT；不悄悄退回 DIRECT，也不自动跨国。
custom_proxy_group=台湾-固定`select`^(?!.*(下载|公益|备用|剩余|到期|官网|异常)).*(台湾|台灣|🇹🇼|Taiwan|TaiWan|Tai Wan|(?:^|[^A-Za-z])TW(?:[^A-Za-z]|$))`[]REJECT
custom_proxy_group=香港-固定`select`^(?!.*(下载|公益|备用|剩余|到期|官网|异常)).*(香港|🇭🇰|Hong Kong|HongKong|(?:^|[^A-Za-z])HK(?:[^A-Za-z]|$))`[]REJECT
custom_proxy_group=日本-固定`select`^(?!.*(下载|公益|备用|剩余|到期|官网|异常)).*(日本|🇯🇵|Japan|(?:^|[^A-Za-z])JP(?:[^A-Za-z]|$))`[]REJECT
custom_proxy_group=新加坡-固定`select`^(?!.*(下载|公益|备用|剩余|到期|官网|异常)).*(新加坡|🇸🇬|Singapore|(?:^|[^A-Za-z])SG(?:[^A-Za-z]|$))`[]REJECT
custom_proxy_group=美国-固定`select`^(?!.*(下载|公益|备用|剩余|到期|官网|异常)).*(美国|🇺🇸|United States|(?:^|[^A-Za-z])US(?:[^A-Za-z]|$))`[]REJECT
custom_proxy_group=全部-手动`select`^(?!.*(下载|公益|备用|剩余|到期|官网|异常)).+`[]REJECT

enable_rule_generator=true
overwrite_original_rules=true
